<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ピアノ練習アプリ</title>
<style>
  :root{
    --bg:#1e2530;
    --panel:#262f3d;
    --accent:#3ea6ff;
    --next:#ffb020;
    --correct:#33cc66;
    --wrong:#ff4d4d;
    --text:#eef2f7;
    --sub:#9aa7b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  header{
    padding:12px 16px 8px;
    text-align:center;
    flex-shrink:0;
  }
  header h1{ margin:0 0 2px; font-size:20px; font-weight:600; }
  header p{ margin:0; font-size:12px; color:var(--sub); }

  #controls{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px 18px;
    padding:10px 16px;
    background:var(--panel);
    border-radius:14px;
    margin:0 12px 8px;
    flex-shrink:0;
  }
  .ctrl-group{ display:flex; align-items:center; gap:8px; }
  .ctrl-group label{ font-size:13px; color:var(--sub); white-space:nowrap; }

  input[type=range]{ width:130px; accent-color:var(--accent); }
  #bpmVal{ font-variant-numeric:tabular-nums; width:44px; text-align:right; font-size:14px; }

  button{
    border:none; border-radius:10px; padding:9px 16px;
    font-size:14px; font-weight:600; color:#fff;
    background:#39465a; cursor:pointer;
  }
  button:active{ transform:scale(0.96); }
  button.primary{ background:var(--accent); color:#08213a; }
  button.toggled{ background:var(--next); color:#3a2600; }

  select{
    background:#39465a; color:var(--text); border:none; border-radius:8px;
    padding:8px 10px; font-size:13px;
  }

  #status{
    text-align:center; font-size:13px; color:var(--sub); padding:2px 0 6px; flex-shrink:0;
  }
  #status b{ color:var(--text); }

  #progressWrap{
    padding:0 16px 6px; flex-shrink:0;
  }
  #progressBar{
    height:6px; background:#39465a; border-radius:4px; overflow:hidden;
  }
  #progressFill{
    height:100%; width:0%; background:var(--accent); transition:width .15s linear;
  }

  #keyboardWrap{
    flex:1;
    display:flex; align-items:flex-end; justify-content:center;
    padding:0 10px 14px;
    overflow-x:auto;
  }
  #keyboard{
    position:relative;
    display:flex;
    height:min(58vh, 340px);
    touch-action:manipulation;
  }
  .white-key{
    position:relative;
    width:56px;
    height:100%;
    background:linear-gradient(#fdfdfd,#e7e9ec);
    border:1px solid #10151d;
    border-radius:0 0 8px 8px;
    margin-right:-1px;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:10px;
    color:#4a5568;
    font-size:11px;
    z-index:1;
  }
  .black-key{
    position:absolute;
    top:0;
    width:34px;
    height:62%;
    background:linear-gradient(#2a2f38,#0c0e12);
    border:1px solid #000;
    border-radius:0 0 6px 6px;
    z-index:2;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:8px;
    color:#cbd3df;
    font-size:9px;
  }
  .white-key.active, .black-key.active{ filter:brightness(0.8); }

  .white-key.next{ background:linear-gradient(var(--next), #d18e00); color:#3a2600; }
  .black-key.next{ background:linear-gradient(var(--next), #d18e00); color:#3a2600; }

  .white-key.correct, .black-key.correct{ background:linear-gradient(var(--correct), #1f9e4d) !important; color:#06230f; }
  .white-key.wrong, .black-key.wrong{ background:linear-gradient(var(--wrong), #cc2b2b) !important; color:#3a0606; }
  .white-key.playing, .black-key.playing{ background:linear-gradient(var(--accent), #1a7fd6) !important; color:#08213a; }

  #noteLabelToggleWrap{ display:flex; align-items:center; gap:6px; }
  .keylabel{ opacity:1; }
  .keylabel.hidden{ opacity:0; }

  #legend{
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    padding:0 16px 10px; font-size:11px; color:var(--sub); flex-shrink:0;
  }
  .legend-item{ display:flex; align-items:center; gap:5px; }
  .dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* ---- エディタ画面 ---- */
  #playPanel.hide, #editPanel.hide{ display:none; }

  #editPanel{
    flex-shrink:0;
  }
  #editControls{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:10px 18px;
    padding:10px 16px;
    background:var(--panel);
    border-radius:14px;
    margin:0 12px 8px;
  }
  #editControls input[type=text]{
    padding:8px 10px; border-radius:8px; border:none; font-size:13px;
    background:#39465a; color:var(--text); width:150px;
  }
  #durationBtns{ display:flex; gap:6px; flex-wrap:wrap; }
  .dur-btn{ padding:7px 11px; font-size:12px; background:#39465a; border-radius:8px; }
  .dur-btn.selected{ background:var(--accent); color:#08213a; }

  #editHint{
    text-align:center; font-size:12px; color:var(--sub);
    padding:0 16px 6px;
  }

  #noteChipsWrap{
    padding:0 16px 10px;
    overflow-x:auto;
    white-space:nowrap;
  }
  #noteChips{ display:inline-flex; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:#39465a; border-radius:8px; padding:7px 10px;
    font-size:12px; cursor:pointer; flex-shrink:0;
  }
  .chip .chip-x{ opacity:.55; font-size:11px; }
  .chip:active{ background:var(--wrong); }
  #emptyChipsMsg{ color:var(--sub); font-size:12px; padding:4px 16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="songTitle">ピアノ練習アプリ</h1>
    <p id="songNote">曲データを読み込んで、次に押す鍵盤を確認しながら練習できます</p>
  </header>

  <div id="controls">
    <div class="ctrl-group">
      <label for="tempoRange">テンポ</label>
      <input type="range" id="tempoRange" min="40" max="200" value="100">
      <span id="bpmVal">100</span><span style="font-size:12px;color:var(--sub)">BPM</span>
    </div>

    <div class="ctrl-group">
      <label for="modeSelect">モード</label>
      <select id="modeSelect">
        <option value="practice">練習(自分でタップして進む)</option>
        <option value="demo">デモ再生(自動で流れる)</option>
      </select>
    </div>

    <div class="ctrl-group">
      <button id="playBtn" class="primary">▶ 再生 / 開始</button>
      <button id="resetBtn">⟲ 最初から</button>
      <button id="labelBtn" class="toggled">音名表示</button>
      <button id="soundBtn" class="toggled">音を鳴らす</button>
      <button id="editModeBtn">✏️ 曲エディタを開く</button>
    </div>
  </div>

  <div id="playPanel">
    <div id="status">次の鍵盤: <b id="nextNoteText">-</b> ｜ 進捗 <b id="progressText">0 / 0</b></div>

    <div id="progressWrap">
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
  </div>

  <div id="editPanel" class="hide">
    <div id="editControls">
      <div class="ctrl-group">
        <label for="songTitleInput">曲名</label>
        <input type="text" id="songTitleInput" value="マイソング">
      </div>
      <div class="ctrl-group">
        <label>音の長さ</label>
        <div id="durationBtns">
          <button class="dur-btn" data-beats="0.25">16分</button>
          <button class="dur-btn" data-beats="0.5">8分</button>
          <button class="dur-btn selected" data-beats="1">4分</button>
          <button class="dur-btn" data-beats="1.5">付点4分</button>
          <button class="dur-btn" data-beats="2">2分</button>
          <button class="dur-btn" data-beats="4">全音符</button>
        </div>
      </div>
      <div class="ctrl-group">
        <button id="undoNoteBtn">⟲ 1音戻す</button>
        <button id="clearEditBtn">🗑 全消去</button>
        <button id="previewEditBtn" class="primary">▶ 試聴</button>
      </div>
      <div class="ctrl-group">
        <button id="applyEditBtn" class="toggled">✅ 演奏画面にセット</button>
        <button id="copyEditBtn">📋 コードをコピー</button>
      </div>
    </div>
    <div id="editHint">下の鍵盤をタップすると、選択中の音の長さでこの曲に追加されます</div>
    <div id="noteChipsWrap"><div id="noteChips"></div></div>
  </div>

  <div id="keyboardWrap">
    <div id="keyboard"></div>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="dot" style="background:var(--next)"></span>次に押す鍵盤</div>
    <div class="legend-item"><span class="dot" style="background:var(--correct)"></span>正解</div>
    <div class="legend-item"><span class="dot" style="background:var(--wrong)"></span>不正解</div>
    <div class="legend-item"><span class="dot" style="background:var(--accent)"></span>デモ再生中</div>
  </div>
</div>

<script>
/* =========================================================
   鍵盤の生成 (C3 〜 C6、白鍵21・黒鍵15)
   ========================================================= */
const NOTE_ORDER = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const START_OCT = 3, END_OCT = 6; // C3 から C6 まで

function midiOf(note, octave){
  const idx = NOTE_ORDER.indexOf(note);
  return (octave + 1) * 12 + idx;
}
function freqOf(midi){
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// 鍵盤データを組み立て(白鍵は左から順、黒鍵はその間に絶対配置)
const whiteNotes = ["C","D","E","F","G","A","B"];
const blackAfter = {"C":"C#","D":"D#","F":"F#","G":"G#","A":"A#"}; // その白鍵の直後に黒鍵がある場合

let keys = []; // {id, note, octave, type, el}
const keyboardEl = document.getElementById("keyboard");

let whiteIndex = 0;
const WHITE_W = 56;
for(let oct = START_OCT; oct <= END_OCT; oct++){
  for(const wn of whiteNotes){
    if(oct === END_OCT && wn !== "C") break; // 最後はCだけ
    const id = wn + oct;
    const el = document.createElement("div");
    el.className = "white-key";
    el.dataset.id = id;
    const label = document.createElement("span");
    label.className = "keylabel";
    label.textContent = id;
    el.appendChild(label);
    keyboardEl.appendChild(el);
    keys.push({id, note:wn, octave:oct, type:"white", el, label});

    if(blackAfter[wn] && !(oct === END_OCT)){
      const bn = blackAfter[wn];
      const bid = bn + oct;
      const bel = document.createElement("div");
      bel.className = "black-key";
      bel.dataset.id = bid;
      bel.style.left = (whiteIndex * WHITE_W + WHITE_W - 17) + "px";
      const blabel = document.createElement("span");
      blabel.className = "keylabel";
      blabel.textContent = bid;
      bel.appendChild(blabel);
      keyboardEl.appendChild(bel);
      keys.push({id:bid, note:bn, octave:oct, type:"black", el:bel, label:blabel});
    }
    whiteIndex++;
  }
}
keyboardEl.style.width = (whiteIndex * WHITE_W) + "px";

const keyMap = {};
keys.forEach(k => keyMap[k.id] = k);

/* =========================================================
   音源 (Web Audio API による簡易ピアノ音)
   ========================================================= */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function playTone(id, duration=0.5){
  if(!soundOn) return;
  ensureAudio();
  const k = keyMap[id];
  if(!k) return;
  const midi = midiOf(k.note, k.octave);
  const freq = freqOf(midi);
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

/* =========================================================
   曲データ
   -----------------------------------------------------------
   「シンコペイテッドクロック」はLeroy Anderson作曲の著作権保護
   下にある楽曲のため、実際の旋律をそのまま書き起こして組み込む
   ことができません。代わりに、練習用のサンプルパターンを1つ
   同梱しています。お手持ちの楽譜(購入・所持しているもの)を
   見ながら、下の SONGS 配列と同じ書式でご自身の曲データを
   追加していただければ、そのままこのアプリで使えます。

   1音あたりのデータ形式:
     { id: "鍵盤ID(例 'C4','F#4')", beats: 拍数(1=四分音符相当) }
   ========================================================= */
const SONGS = {
  sample: {
    title: "サンプル練習パターン",
    note: "付点音符を含むシンコペーション風の練習パターン(著作権保護楽曲そのものではありません)",
    notes: [
      {id:"C4", beats:0.5}, {id:"E4", beats:0.5}, {id:"G4", beats:1},
      {id:"E4", beats:0.5}, {id:"C4", beats:0.5}, {id:"G3", beats:1},
      {id:"C4", beats:0.5}, {id:"E4", beats:0.5}, {id:"G4", beats:0.5}, {id:"C5", beats:0.5},
      {id:"G4", beats:1}, {id:"E4", beats:1},
      {id:"F4", beats:0.5}, {id:"A4", beats:0.5}, {id:"C5", beats:1},
      {id:"A4", beats:0.5}, {id:"F4", beats:0.5}, {id:"C4", beats:1},
      {id:"D4", beats:0.5}, {id:"F4", beats:0.5}, {id:"A4", beats:0.5}, {id:"D5", beats:0.5},
      {id:"C5", beats:2}
    ]
  }
};

let currentSongKey = "sample";
let song = SONGS[currentSongKey];

document.getElementById("songTitle").textContent = song.title;
document.getElementById("songNote").textContent = song.note;

/* =========================================================
   状態管理
   ========================================================= */
let index = 0;
let bpm = 100;
let mode = "practice"; // "practice" | "demo"
let soundOn = true;
let labelsOn = true;
let demoTimer = null;
let demoPlaying = false;

let viewState = "play"; // "play" | "edit"
let editorNotes = [];
let editorDuration = 1;
let editorPreviewTimer = null;
let editorPreviewPlaying = false;

const nextNoteText = document.getElementById("nextNoteText");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");

function clearHighlights(){
  keys.forEach(k => k.el.classList.remove("next","correct","wrong","playing","active"));
}

function highlightNext(){
  clearHighlights();
  if(index >= song.notes.length){
    nextNoteText.textContent = "🎉 完了!";
    progressText.textContent = `${song.notes.length} / ${song.notes.length}`;
    progressFill.style.width = "100%";
    return;
  }
  const step = song.notes[index];
  const k = keyMap[step.id];
  if(k) k.el.classList.add("next");
  nextNoteText.textContent = step.id;
  progressText.textContent = `${index} / ${song.notes.length}`;
  progressFill.style.width = (index / song.notes.length * 100) + "%";
}

function flash(el, cls, ms){
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---- 練習モード: 正しい鍵盤をタップしたら次へ ---- */
function handleKeyPress(id){
  ensureAudio();
  const k = keyMap[id];
  if(!k) return;

  k.el.classList.add("active");
  setTimeout(() => k.el.classList.remove("active"), 120);
  playTone(id, 0.4);

  if(viewState === "edit"){
    editorNotes.push({id, beats: editorDuration});
    renderChips();
    return;
  }

  if(mode !== "practice" || demoPlaying) return;
  if(index >= song.notes.length) return;

  const expected = song.notes[index].id;
  if(id === expected){
    flash(k.el, "correct", 260);
    index++;
    setTimeout(highlightNext, 150);
  } else {
    flash(k.el, "wrong", 260);
  }
}

keys.forEach(k => {
  k.el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handleKeyPress(k.id);
  });
});

/* ---- デモ再生モード: テンポに合わせて自動再生 ---- */
function beatMs(){ return 60000 / bpm; }

function stopDemo(){
  demoPlaying = false;
  if(demoTimer) clearTimeout(demoTimer);
  demoTimer = null;
  document.getElementById("playBtn").textContent = "▶ 再生 / 開始";
}

function stepDemo(){
  clearHighlights();
  if(index >= song.notes.length){
    stopDemo();
    nextNoteText.textContent = "🎉 完了!";
    progressText.textContent = `${song.notes.length} / ${song.notes.length}`;
    progressFill.style.width = "100%";
    return;
  }
  const step = song.notes[index];
  const k = keyMap[step.id];
  if(k){
    k.el.classList.add("playing");
    playTone(step.id, Math.min(0.9, step.beats * beatMs() / 1000));
  }
  nextNoteText.textContent = step.id;
  progressText.textContent = `${index} / ${song.notes.length}`;
  progressFill.style.width = (index / song.notes.length * 100) + "%";

  const dur = step.beats * beatMs();
  index++;
  demoTimer = setTimeout(stepDemo, dur);
}

function startDemo(){
  demoPlaying = true;
  document.getElementById("playBtn").textContent = "⏸ 停止";
  stepDemo();
}

/* ---- 再生ボタン ---- */
document.getElementById("playBtn").addEventListener("click", () => {
  ensureAudio();
  if(mode === "demo"){
    if(demoPlaying){ stopDemo(); }
    else {
      if(index >= song.notes.length) index = 0;
      startDemo();
    }
  } else {
    // 練習モードでは「開始」を押すと最初のヒントを表示
    highlightNext();
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  stopDemo();
  index = 0;
  clearHighlights();
  highlightNext();
});

document.getElementById("tempoRange").addEventListener("input", (e) => {
  bpm = parseInt(e.target.value, 10);
  document.getElementById("bpmVal").textContent = bpm;
});

document.getElementById("modeSelect").addEventListener("change", (e) => {
  stopDemo();
  mode = e.target.value;
  index = 0;
  clearHighlights();
  highlightNext();
});

document.getElementById("labelBtn").addEventListener("click", (e) => {
  labelsOn = !labelsOn;
  e.target.classList.toggle("toggled", labelsOn);
  keys.forEach(k => k.label.classList.toggle("hidden", !labelsOn));
});

document.getElementById("soundBtn").addEventListener("click", (e) => {
  soundOn = !soundOn;
  e.target.classList.toggle("toggled", soundOn);
});

/* =========================================================
   曲エディタ
   ========================================================= */
const playPanel = document.getElementById("playPanel");
const editPanel = document.getElementById("editPanel");
const noteChips = document.getElementById("noteChips");
const editModeBtn = document.getElementById("editModeBtn");

const DUR_LABEL = {0.25:"16分", 0.5:"8分", 1:"4分", 1.5:"付点4分", 2:"2分", 4:"全音符"};

function setView(next){
  stopDemo();
  stopEditorPreview();
  viewState = next;
  if(next === "edit"){
    playPanel.classList.add("hide");
    editPanel.classList.remove("hide");
    editModeBtn.textContent = "▶ 演奏画面に戻る";
    clearHighlights();
  } else {
    editPanel.classList.add("hide");
    playPanel.classList.remove("hide");
    editModeBtn.textContent = "✏️ 曲エディタを開く";
    highlightNext();
  }
}
editModeBtn.addEventListener("click", () => setView(viewState === "edit" ? "play" : "edit"));

document.querySelectorAll(".dur-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".dur-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    editorDuration = parseFloat(btn.dataset.beats);
  });
});

function renderChips(){
  noteChips.innerHTML = "";
  if(editorNotes.length === 0){
    const msg = document.createElement("span");
    msg.id = "emptyChipsMsg";
    msg.textContent = "まだ音符がありません。下の鍵盤をタップして追加してください";
    noteChips.appendChild(msg);
    return;
  }
  editorNotes.forEach((n, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${n.id} ・ ${DUR_LABEL[n.beats] || n.beats + "拍"} <span class="chip-x">✕</span>`;
    chip.addEventListener("click", () => {
      editorNotes.splice(i, 1);
      renderChips();
    });
    noteChips.appendChild(chip);
  });
  // 追加時は右端(最新)が見えるように自動スクロール
  noteChips.parentElement.scrollLeft = noteChips.parentElement.scrollWidth;
}

document.getElementById("undoNoteBtn").addEventListener("click", () => {
  editorNotes.pop();
  renderChips();
});

document.getElementById("clearEditBtn").addEventListener("click", () => {
  if(editorNotes.length && !confirm("この曲のすべての音符を消去しますか?")) return;
  editorNotes = [];
  renderChips();
});

function stopEditorPreview(){
  editorPreviewPlaying = false;
  if(editorPreviewTimer) clearTimeout(editorPreviewTimer);
  editorPreviewTimer = null;
  document.getElementById("previewEditBtn").textContent = "▶ 試聴";
}

function stepEditorPreview(i){
  if(i >= editorNotes.length){
    stopEditorPreview();
    clearHighlights();
    return;
  }
  clearHighlights();
  const step = editorNotes[i];
  const k = keyMap[step.id];
  if(k){
    k.el.classList.add("playing");
    playTone(step.id, Math.min(0.9, step.beats * beatMs() / 1000));
  }
  const dur = step.beats * beatMs();
  editorPreviewTimer = setTimeout(() => stepEditorPreview(i + 1), dur);
}

document.getElementById("previewEditBtn").addEventListener("click", () => {
  ensureAudio();
  if(editorPreviewPlaying){ stopEditorPreview(); clearHighlights(); return; }
  if(editorNotes.length === 0) return;
  editorPreviewPlaying = true;
  document.getElementById("previewEditBtn").textContent = "⏸ 停止";
  stepEditorPreview(0);
});

document.getElementById("applyEditBtn").addEventListener("click", () => {
  if(editorNotes.length === 0){
    alert("まず音符を追加してください");
    return;
  }
  const title = document.getElementById("songTitleInput").value.trim() || "マイソング";
  SONGS.custom = {
    title,
    note: "エディタで作成したオリジナルの曲データです",
    notes: editorNotes.map(n => ({id:n.id, beats:n.beats}))
  };
  currentSongKey = "custom";
  song = SONGS.custom;
  document.getElementById("songTitle").textContent = song.title;
  document.getElementById("songNote").textContent = song.note;
  index = 0;
  setView("play");
});

document.getElementById("copyEditBtn").addEventListener("click", async () => {
  if(editorNotes.length === 0){
    alert("まず音符を追加してください");
    return;
  }
  const lines = editorNotes.map(n => `      {id:"${n.id}", beats:${n.beats}}`).join(",\n");
  const code =
`title: "${document.getElementById("songTitleInput").value.trim() || "マイソング"}",
note: "エディタで作成したオリジナルの曲データです",
notes: [
${lines}
]`;
  try{
    await navigator.clipboard.writeText(code);
    alert("コードをコピーしました。SONGS オブジェクトに貼り付けて使えます。");
  }catch(e){
    prompt("コピーできなかったため、下のテキストを手動でコピーしてください:", code);
  }
});

renderChips();

/* 初期表示 */
highlightNext();
</script>
</body>
</html>
