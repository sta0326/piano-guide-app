<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ピアノ練習アプリ</title>
<style>
  :root{
    --bg:#1e2530;
    --panel:#262f3d;
    --accent:#3ea6ff;
    --next:#ffb020;
    --correct:#33cc66;
    --wrong:#ff4d4d;
    --rest:#8a67e8;
    --text:#eef2f7;
    --sub:#9aa7b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow:hidden;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

header{ padding:12px 16px 8px; text-align:center; flex-shrink:0; }
header h1{ margin:0 0 2px; font-size:20px; font-weight:600; }
header p{ margin:0; font-size:12px; color:var(–sub); }

#controls{
display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
gap:10px 18px; padding:10px 16px; background:var(–panel);
border-radius:14px; margin:0 12px 8px; flex-shrink:0;
}
.ctrl-group{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ctrl-group label{ font-size:13px; color:var(–sub); white-space:nowrap; }

input[type=range]{ width:130px; accent-color:var(–accent); }
#bpmVal{ font-variant-numeric:tabular-nums; width:44px; text-align:right; font-size:14px; }

button{
border:none; border-radius:10px; padding:9px 14px;
font-size:13px; font-weight:600; color:#fff;
background:#39465a; cursor:pointer;
}
button:active{ transform:scale(0.96); }
button.primary{ background:var(–accent); color:#08213a; }
button.toggled{ background:var(–next); color:#3a2600; }
button.toggled-rest{ background:var(–rest); color:#fff; }

select{
background:#39465a; color:var(–text); border:none; border-radius:8px;
padding:8px 10px; font-size:13px;
}

#status{ text-align:center; font-size:13px; color:var(–sub); padding:2px 0 6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
#status b{ color:var(–text); }
#skipStepBtn{ display:none; }
#skipStepBtn.show{ display:inline-block; }

#progressWrap{ padding:0 16px 6px; flex-shrink:0; }
#progressBar{ height:6px; background:#39465a; border-radius:4px; overflow:hidden; }
#progressFill{ height:100%; width:0%; background:var(–accent); transition:width .15s linear; }

#keyboardWrap{
flex:1; display:flex; align-items:flex-end; justify-content:center;
padding:0 10px 14px; overflow-x:auto;
}
#keyboard{ position:relative; display:flex; height:min(58vh, 340px); touch-action:manipulation; }
.white-key{
position:relative; width:56px; height:100%;
background:linear-gradient(#fdfdfd,#e7e9ec);
border:1px solid #10151d; border-radius:0 0 8px 8px;
margin-right:-1px; display:flex; align-items:flex-end; justify-content:center;
padding-bottom:10px; color:#4a5568; font-size:11px; z-index:1;
}
.black-key{
position:absolute; top:0; width:34px; height:62%;
background:linear-gradient(#2a2f38,#0c0e12);
border:1px solid #000; border-radius:0 0 6px 6px; z-index:2;
display:flex; align-items:flex-end; justify-content:center;
padding-bottom:8px; color:#cbd3df; font-size:9px;
}
.white-key.active, .black-key.active{ filter:brightness(0.8); }
.white-key.next{ background:linear-gradient(var(–next), #d18e00); color:#3a2600; }
.black-key.next{ background:linear-gradient(var(–next), #d18e00); color:#3a2600; }
.white-key.correct, .black-key.correct{ background:linear-gradient(var(–correct), #1f9e4d) !important; color:#06230f; }
.white-key.wrong, .black-key.wrong{ background:linear-gradient(var(–wrong), #cc2b2b) !important; color:#3a0606; }
.white-key.playing, .black-key.playing{ background:linear-gradient(var(–accent), #1a7fd6) !important; color:#08213a; }

.keylabel{ opacity:1; }
.keylabel.hidden{ opacity:0; }

#legend{
display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
padding:0 16px 10px; font-size:11px; color:var(–sub); flex-shrink:0;
}
.legend-item{ display:flex; align-items:center; gap:5px; }
.dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }

/* –– エディタ画面 –– */
#playPanel.hide, #editPanel.hide{ display:none; }
#editPanel{ flex-shrink:0; }
#editControls{
display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
gap:8px 16px; padding:10px 16px; background:var(–panel);
border-radius:14px; margin:0 12px 6px;
}
#editControls input[type=text]{
padding:8px 10px; border-radius:8px; border:none; font-size:13px;
background:#39465a; color:var(–text); width:140px;
}
.edit-row-label{ font-size:11px; color:var(–sub); text-align:center; margin:2px 0 -2px; }
#durationBtns, #restBtns, #modBtns{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.dur-btn{ padding:7px 10px; font-size:12px; background:#39465a; border-radius:8px; }
.dur-btn.selected{ background:var(–accent); color:#08213a; }
.rest-btn{ background:#4a3b6e; }
.rest-btn:active{ background:var(–rest); }

#editHint{ text-align:center; font-size:12px; color:var(–sub); padding:0 16px 6px; }

#noteChipsWrap{ padding:0 16px 10px; overflow-x:auto; white-space:nowrap; }
#noteChips{ display:inline-flex; gap:6px; }
.chip{
display:inline-flex; align-items:center; gap:6px;
background:#39465a; border-radius:8px; padding:7px 10px;
font-size:12px; cursor:pointer; flex-shrink:0;
}
.chip.chip-rest{ background:#4a3b6e; }
.chip .chip-x{ opacity:.55; font-size:11px; }
.chip:active{ background:var(–wrong); }
#emptyChipsMsg{ color:var(–sub); font-size:12px; padding:4px 16px; }
</style>

</head>

<script>
/* =========================================================
   鍵盤の生成 (C3 〜 C6、白鍵21・黒鍵15)
   ========================================================= */
const NOTE_ORDER = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const START_OCT = 3, END_OCT = 6;

function midiOf(note, octave){
  const idx = NOTE_ORDER.indexOf(note);
  return (octave + 1) * 12 + idx;
}
function freqOf(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

const whiteNotes = ["C","D","E","F","G","A","B"];
const blackAfter = {"C":"C#","D":"D#","F":"F#","G":"G#","A":"A#"};

let keys = [];
const keyboardEl = document.getElementById("keyboard");

let whiteIndex = 0;
const WHITE_W = 56;
for(let oct = START_OCT; oct <= END_OCT; oct++){
  for(const wn of whiteNotes){
    if(oct === END_OCT && wn !== "C") break;
    const id = wn + oct;
    const el = document.createElement("div");
    el.className = "white-key";
    el.dataset.id = id;
    const label = document.createElement("span");
    label.className = "keylabel";
    label.textContent = id;
    el.appendChild(label);
    keyboardEl.appendChild(el);
    keys.push({id, note:wn, octave:oct, type:"white", el, label});

    if(blackAfter[wn] && !(oct === END_OCT)){
      const bn = blackAfter[wn];
      const bid = bn + oct;
      const bel = document.createElement("div");
      bel.className = "black-key";
      bel.dataset.id = bid;
      bel.style.left = (whiteIndex * WHITE_W + WHITE_W - 17) + "px";
      const blabel = document.createElement("span");
      blabel.className = "keylabel";
      blabel.textContent = bid;
      bel.appendChild(blabel);
      keyboardEl.appendChild(bel);
      keys.push({id:bid, note:bn, octave:oct, type:"black", el:bel, label:blabel});
    }
    whiteIndex++;
  }
}
keyboardEl.style.width = (whiteIndex * WHITE_W) + "px";

const keyMap = {};
keys.forEach(k => keyMap[k.id] = k);

/* =========================================================
   音源
   ========================================================= */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function playTone(id, duration=0.5){
  if(!soundOn) return;
  ensureAudio();
  const k = keyMap[id];
  if(!k) return;
  const midi = midiOf(k.note, k.octave);
  const freq = freqOf(midi);
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.05);
}

/* =========================================================
   曲データ
   -----------------------------------------------------------
   「シンコペイテッドクロック」はLeroy Anderson作曲の著作権保護
   下にある楽曲のため、実際の旋律をそのまま書き起こして組み込む
   ことができません。代わりに練習用のサンプルパターンを同梱して
   います。お手持ちの楽譜を見ながら曲エディタで音符・休符・タイ・
   スタッカートを入力すれば、そのままこのアプリで使えます。

   1音あたりのデータ形式:
     { id: "鍵盤ID(休符は null)", beats: 拍数,
       rest: true/false(休符かどうか),
       tie: true/false(直前の音とタイで結ばれているか),
       staccato: true/false(スタッカートか) }
   ========================================================= */
const SONGS = {
  sample: {
    title: "サンプル練習パターン",
    note: "付点音符・休符・タイ・スタッカートを含む練習パターン(著作権保護楽曲そのものではありません)",
    notes: [
      {id:"C4", beats:0.5, staccato:true}, {id:"E4", beats:0.5, staccato:true}, {id:"G4", beats:1},
      {id:null, beats:0.5, rest:true},
      {id:"E4", beats:0.5}, {id:"C4", beats:0.5}, {id:"G3", beats:1},
      {id:"C4", beats:0.75}, {id:"E4", beats:0.25}, {id:"G4", beats:0.5}, {id:"C5", beats:0.5},
      {id:"G4", beats:1}, {id:"G4", beats:1, tie:true},
      {id:null, beats:1, rest:true},
      {id:"F4", beats:0.5}, {id:"A4", beats:0.5}, {id:"C5", beats:1},
      {id:"A4", beats:0.5, staccato:true}, {id:"F4", beats:0.5, staccato:true}, {id:"C4", beats:1},
      {id:"D4", beats:0.5}, {id:"F4", beats:0.5}, {id:"A4", beats:0.5}, {id:"D5", beats:0.5},
      {id:"C5", beats:3}
    ]
  }
};

let currentSongKey = "sample";
let song = SONGS[currentSongKey];

document.getElementById("songTitle").textContent = song.title;
document.getElementById("songNote").textContent = song.note;

/* =========================================================
   状態管理
   ========================================================= */
let index = 0;
let bpm = 100;
let mode = "practice";
let soundOn = true;
let labelsOn = true;
let demoTimer = null;
let demoPlaying = false;

let viewState = "play";
let editorNotes = [];
let editorDuration = 1;
let editorTie = false;
let editorStaccato = false;
let editorPreviewTimer = null;
let editorPreviewPlaying = false;

const nextNoteText = document.getElementById("nextNoteText");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const skipStepBtn = document.getElementById("skipStepBtn");

function clearHighlights(){
  keys.forEach(k => k.el.classList.remove("next","correct","wrong","playing","active"));
}

function stepLabel(step){
  if(step.rest) return "休符";
  let t = step.id;
  if(step.tie) t += "(タイ)";
  if(step.staccato) t += "(スタッカート)";
  return t;
}

function isAutoStep(step){
  // 休符・タイは鍵盤タップ不要なので「次へ」ボタンで進める
  return !!(step.rest || step.tie);
}

function highlightNext(){
  clearHighlights();
  if(index >= song.notes.length){
    nextNoteText.textContent = "🎉 完了!";
    progressText.textContent = `${song.notes.length} / ${song.notes.length}`;
    progressFill.style.width = "100%";
    skipStepBtn.classList.remove("show");
    return;
  }
  const step = song.notes[index];
  nextNoteText.textContent = stepLabel(step);
  progressText.textContent = `${index} / ${song.notes.length}`;
  progressFill.style.width = (index / song.notes.length * 100) + "%";

  if(step.rest || step.tie){
    skipStepBtn.classList.add("show");
    if(!step.rest){
      const k = keyMap[step.id];
      if(k) k.el.classList.add("next");
    }
  } else {
    skipStepBtn.classList.remove("show");
    const k = keyMap[step.id];
    if(k) k.el.classList.add("next");
  }
}

skipStepBtn.addEventListener("click", () => {
  if(mode !== "practice" || demoPlaying) return;
  if(index >= song.notes.length) return;
  index++;
  highlightNext();
});

function flash(el, cls, ms){
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---- 練習モード ---- */
function handleKeyPress(id){
  ensureAudio();
  const k = keyMap[id];
  if(!k) return;

  k.el.classList.add("active");
  setTimeout(() => k.el.classList.remove("active"), 120);
  playTone(id, 0.4);

  if(viewState === "edit"){
    editorNotes.push({id, beats: editorDuration, tie: editorTie, staccato: editorStaccato});
    editorTie = false;
    editorStaccato = false;
    document.getElementById("tieBtn").classList.remove("toggled-rest");
    document.getElementById("staccatoBtn").classList.remove("toggled-rest");
    renderChips();
    return;
  }

  if(mode !== "practice" || demoPlaying) return;
  if(index >= song.notes.length) return;

  const step = song.notes[index];
  if(step.rest) return; // 休符の間は鍵盤入力を無視

  if(id === step.id){
    flash(k.el, "correct", 260);
    index++;
    setTimeout(highlightNext, 150);
  } else {
    flash(k.el, "wrong", 260);
  }
}

keys.forEach(k => {
  k.el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handleKeyPress(k.id);
  });
});

/* ---- デモ再生モード ---- */
function beatMs(){ return 60000 / bpm; }

function soundDurationFor(step){
  const full = step.beats * beatMs() / 1000;
  const dur = step.staccato ? full * 0.4 : full * 0.92;
  return Math.max(0.08, Math.min(0.9, dur));
}

function stopDemo(){
  demoPlaying = false;
  if(demoTimer) clearTimeout(demoTimer);
  demoTimer = null;
  document.getElementById("playBtn").textContent = "▶ 再生 / 開始";
}

function stepDemo(){
  clearHighlights();
  if(index >= song.notes.length){
    stopDemo();
    nextNoteText.textContent = "🎉 完了!";
    progressText.textContent = `${song.notes.length} / ${song.notes.length}`;
    progressFill.style.width = "100%";
    return;
  }
  const step = song.notes[index];
  if(step.rest){
    nextNoteText.textContent = "休符";
  } else {
    const k = keyMap[step.id];
    if(k){
      k.el.classList.add("playing");
      playTone(step.id, soundDurationFor(step));
    }
    nextNoteText.textContent = stepLabel(step);
  }
  progressText.textContent = `${index} / ${song.notes.length}`;
  progressFill.style.width = (index / song.notes.length * 100) + "%";

  const dur = step.beats * beatMs();
  index++;
  demoTimer = setTimeout(stepDemo, dur);
}

function startDemo(){
  demoPlaying = true;
  skipStepBtn.classList.remove("show");
  document.getElementById("playBtn").textContent = "⏸ 停止";
  stepDemo();
}

document.getElementById("playBtn").addEventListener("click", () => {
  ensureAudio();
  if(mode === "demo"){
    if(demoPlaying){ stopDemo(); }
    else {
      if(index >= song.notes.length) index = 0;
      startDemo();
    }
  } else {
    highlightNext();
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  stopDemo();
  index = 0;
  clearHighlights();
  highlightNext();
});

document.getElementById("tempoRange").addEventListener("input", (e) => {
  bpm = parseInt(e.target.value, 10);
  document.getElementById("bpmVal").textContent = bpm;
});

document.getElementById("modeSelect").addEventListener("change", (e) => {
  stopDemo();
  mode = e.target.value;
  index = 0;
  clearHighlights();
  highlightNext();
});

document.getElementById("labelBtn").addEventListener("click", (e) => {
  labelsOn = !labelsOn;
  e.target.classList.toggle("toggled", labelsOn);
  keys.forEach(k => k.label.classList.toggle("hidden", !labelsOn));
});

document.getElementById("soundBtn").addEventListener("click", (e) => {
  soundOn = !soundOn;
  e.target.classList.toggle("toggled", soundOn);
});

/* =========================================================
   曲エディタ
   ========================================================= */
const playPanel = document.getElementById("playPanel");
const editPanel = document.getElementById("editPanel");
const noteChips = document.getElementById("noteChips");
const editModeBtn = document.getElementById("editModeBtn");

const DUR_LABEL = {
  0.25:"16分", 0.5:"8分", 0.75:"付点8分",
  1:"4分", 1.5:"付点4分", 2:"2分", 3:"付点2分", 4:"全音符"
};

function setView(next){
  stopDemo();
  stopEditorPreview();
  viewState = next;
  if(next === "edit"){
    playPanel.classList.add("hide");
    editPanel.classList.remove("hide");
    editModeBtn.textContent = "▶ 演奏画面に戻る";
    clearHighlights();
  } else {
    editPanel.classList.add("hide");
    playPanel.classList.remove("hide");
    editModeBtn.textContent = "✏️ 曲エディタを開く";
    highlightNext();
  }
}
editModeBtn.addEventListener("click", () => setView(viewState === "edit" ? "play" : "edit"));

document.querySelectorAll(".dur-btn[data-beats]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".dur-btn[data-beats]").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    editorDuration = parseFloat(btn.dataset.beats);
  });
});

document.getElementById("quarterRestBtn").addEventListener("click", () => {
  editorNotes.push({id:null, beats:1, rest:true});
  renderChips();
});
document.getElementById("eighthRestBtn").addEventListener("click", () => {
  editorNotes.push({id:null, beats:0.5, rest:true});
  renderChips();
});

document.getElementById("tieBtn").addEventListener("click", (e) => {
  editorTie = !editorTie;
  e.target.classList.toggle("toggled-rest", editorTie);
});
document.getElementById("staccatoBtn").addEventListener("click", (e) => {
  editorStaccato = !editorStaccato;
  e.target.classList.toggle("toggled-rest", editorStaccato);
});

function chipLabel(n){
  if(n.rest) return `休符 ・ ${DUR_LABEL[n.beats] || n.beats + "拍"}`;
  let s = `${n.id} ・ ${DUR_LABEL[n.beats] || n.beats + "拍"}`;
  if(n.tie) s += " ・タイ";
  if(n.staccato) s += " ・スタッカート";
  return s;
}

function renderChips(){
  noteChips.innerHTML = "";
  if(editorNotes.length === 0){
    const msg = document.createElement("span");
    msg.id = "emptyChipsMsg";
    msg.textContent = "まだ音符がありません。下の鍵盤をタップ、または休符ボタンで追加してください";
    noteChips.appendChild(msg);
    return;
  }
  editorNotes.forEach((n, i) => {
    const chip = document.createElement("span");
    chip.className = "chip" + (n.rest ? " chip-rest" : "");
    chip.innerHTML = `${chipLabel(n)} <span class="chip-x">✕</span>`;
    chip.addEventListener("click", () => {
      editorNotes.splice(i, 1);
      renderChips();
    });
    noteChips.appendChild(chip);
  });
  noteChips.parentElement.scrollLeft = noteChips.parentElement.scrollWidth;
}

document.getElementById("undoNoteBtn").addEventListener("click", () => {
  editorNotes.pop();
  renderChips();
});

document.getElementById("clearEditBtn").addEventListener("click", () => {
  if(editorNotes.length && !confirm("この曲のすべての音符を消去しますか?")) return;
  editorNotes = [];
  renderChips();
});

function stopEditorPreview(){
  editorPreviewPlaying = false;
  if(editorPreviewTimer) clearTimeout(editorPreviewTimer);
  editorPreviewTimer = null;
  document.getElementById("previewEditBtn").textContent = "▶ 試聴";
}

function stepEditorPreview(i){
  if(i >= editorNotes.length){
    stopEditorPreview();
    clearHighlights();
    return;
  }
  clearHighlights();
  const step = editorNotes[i];
  if(!step.rest){
    const k = keyMap[step.id];
    if(k){
      k.el.classList.add("playing");
      playTone(step.id, soundDurationFor(step));
    }
  }
  const dur = step.beats * beatMs();
  editorPreviewTimer = setTimeout(() => stepEditorPreview(i + 1), dur);
}

document.getElementById("previewEditBtn").addEventListener("click", () => {
  ensureAudio();
  if(editorPreviewPlaying){ stopEditorPreview(); clearHighlights(); return; }
  if(editorNotes.length === 0) return;
  editorPreviewPlaying = true;
  document.getElementById("previewEditBtn").textContent = "⏸ 停止";
  stepEditorPreview(0);
});

document.getElementById("applyEditBtn").addEventListener("click", () => {
  if(editorNotes.length === 0){
    alert("まず音符を追加してください");
    return;
  }
  const title = document.getElementById("songTitleInput").value.trim() || "マイソング";
  SONGS.custom = {
    title,
    note: "エディタで作成したオリジナルの曲データです",
    notes: editorNotes.map(n => ({...n}))
  };
  currentSongKey = "custom";
  song = SONGS.custom;
  document.getElementById("songTitle").textContent = song.title;
  document.getElementById("songNote").textContent = song.note;
  index = 0;
  setView("play");
});

document.getElementById("copyEditBtn").addEventListener("click", async () => {
  if(editorNotes.length === 0){
    alert("まず音符を追加してください");
    return;
  }
  const lines = editorNotes.map(n => {
    const parts = [];
    parts.push(`id:${n.rest ? "null" : `"${n.id}"`}`);
    parts.push(`beats:${n.beats}`);
    if(n.rest) parts.push("rest:true");
    if(n.tie) parts.push("tie:true");
    if(n.staccato) parts.push("staccato:true");
    return `      {${parts.join(", ")}}`;
  }).join(",\n");
  const code =
`title: "${document.getElementById("songTitleInput").value.trim() || "マイソング"}",
note: "エディタで作成したオリジナルの曲データです",
notes: [
${lines}
]`;
  try{
    await navigator.clipboard.writeText(code);
    alert("コードをコピーしました。SONGS オブジェクトに貼り付けて使えます。");
  }catch(e){
    prompt("コピーできなかったため、下のテキストを手動でコピーしてください:", code);
  }
});

renderChips();

/* 初期表示 */
highlightNext();
</script>

</body>
</html>
