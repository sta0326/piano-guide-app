<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ピアノれんしゅう</title>
<style>
  :root{
    --night:#0E2A38;
    --night-2:#153B4E;
    --panel:#1B4a5f;
    --ivory:#FFFCF2;
    --ebony:#16222C;
    --glow:#FFC233;
    --glow-deep:#F79A1E;
    --coral:#FF6B5A;
    --mint:#5FD3A6;
    --sky:#7CC6E8;
    --text:#EAF6FB;
    --muted:#9BB6C4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:var(--night);
    color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans",system-ui,sans-serif;
    font-weight:600;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  #app{
    height:100%;height:100dvh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

/* ––––– ヘッダー ––––– */
header{
display:flex;align-items:center;gap:14px;
padding:10px 16px 6px;
}
h1{
font-size:20px;margin:0;letter-spacing:.06em;
color:var(–glow);
}
h1 span{color:var(–text);font-size:15px;margin-left:8px;letter-spacing:.02em;}
nav{margin-left:auto;display:flex;gap:8px;}
.tab{
border:0;border-radius:999px;padding:10px 20px;
font:inherit;font-size:16px;
background:var(–night-2);color:var(–muted);
}
.tab.on{background:var(–glow);color:#2A1C00;}

/* ––––– パネル ––––– */
main{flex:0 0 auto;padding:4px 16px 8px;min-height:0;}
.view{display:none;}
.view.on{display:block;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.row + .row{margin-top:8px;}

.slot{
border:2px solid rgba(255,255,255,.14);
background:var(–night-2);color:var(–text);
border-radius:14px;padding:9px 14px;font:inherit;font-size:15px;
display:flex;align-items:center;gap:8px;min-width:118px;
}
.slot b{font-size:13px;color:var(–sky);font-weight:700;}
.slot.on{border-color:var(–glow);background:#2b4a3c00;box-shadow:inset 0 0 0 99px rgba(255,194,51,.16);}
.slot.empty{color:var(–muted);}

button{font:inherit;}
.btn{
border:0;border-radius:14px;padding:12px 22px;font-size:17px;
background:var(–sky);color:#06222F;
}
.btn.rec{background:var(–coral);color:#3A0B05;}
.btn.go{background:var(–mint);color:#053325;}
.btn.ghost{background:transparent;color:var(–muted);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);}
.btn:disabled{opacity:.35;}
.btn:active{transform:translateY(2px);}

.seg{display:flex;background:var(–night-2);border-radius:14px;padding:4px;gap:4px;}
.seg button{border:0;background:transparent;color:var(–muted);padding:8px 16px;border-radius:11px;font-size:15px;}
.seg button.on{background:var(–sky);color:#06222F;}

input[type=text]{
font:inherit;font-size:16px;border:0;border-radius:12px;
padding:11px 14px;width:200px;
background:var(–night-2);color:var(–text);
}
label.lab{font-size:14px;color:var(–muted);}

/* ––––– ステータス ––––– */
#status{
margin:6px 16px 8px;padding:12px 18px;border-radius:16px;
background:var(–night-2);
font-size:20px;min-height:52px;
display:flex;align-items:center;gap:14px;
}
#status.alert{background:rgba(255,107,90,.22);}
#status.good{background:rgba(95,211,166,.2);}
#bigcount{font-size:34px;color:var(–glow);min-width:52px;text-align:center;}
#target{font-size:30px;color:var(–glow);}
#bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
#bar i{display:block;height:100%;width:0;background:var(–mint);}

/* ––––– けんばん ––––– */
#stage{
flex:1;min-height:0;position:relative;
margin:0 12px 12px;border-radius:20px;
background:linear-gradient(#0b2230,#071820);
padding:12px;
overflow:hidden;
}
#keyboard{position:relative;height:100%;width:100%;}
.wk{
position:absolute;top:0;bottom:0;
background:linear-gradient(#FFFCF2,#EFE7D4);
border-radius:0 0 10px 10px;
box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 -18px 26px rgba(0,0,0,.06);
display:flex;align-items:flex-end;justify-content:center;
padding-bottom:10px;
color:#4E5A63;font-size:15px;
transition:background .05s linear;
}
.bk{
position:absolute;top:0;height:60%;
background:linear-gradient(#2A3945,#101A22);
border-radius:0 0 7px 7px;
box-shadow:0 5px 0 rgba(0,0,0,.5);
z-index:3;
}
.wk.hi{background:var(–ivory);}
.wk.oct2{color:#8A98A2;}

/* 光る */
.key.lit{
background:linear-gradient(#FFD874,var(–glow-deep));
color:#5A3800;
box-shadow:0 0 0 3px rgba(255,194,51,.55), 0 0 26px 6px rgba(255,194,51,.55), 0 5px 0 rgba(0,0,0,.35);
z-index:4;
}
.bk.lit{background:linear-gradient(#FFC85A,#E8850B);}
.key.press{filter:brightness(.86);transform:translateY(2px);}
.key.hit{
background:linear-gradient(#A8F0D4,#3FBF92)!important;color:#06382A!important;
box-shadow:0 0 0 3px rgba(95,211,166,.6),0 0 22px 4px rgba(95,211,166,.5)!important;
}
.key.bad{animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.key.blink{animation:blink .9s ease-in-out infinite;}
@keyframes blink{50%{box-shadow:0 0 0 3px rgba(255,194,51,.9),0 0 34px 10px rgba(255,194,51,.85),0 5px 0 rgba(0,0,0,.35);}}

/* 休符 */
#rest{
position:absolute;inset:12px;border-radius:12px;
background:rgba(190,200,206,.5);
backdrop-filter:blur(1px);
z-index:9;opacity:0;pointer-events:none;
transition:opacity .09s linear;
display:flex;align-items:center;justify-content:center;
font-size:30px;color:#36444E;
}
#rest.on{opacity:1;}

/* カウントダウン */
#count{
position:absolute;inset:0;z-index:20;display:none;
align-items:center;justify-content:center;
background:rgba(8,26,35,.85);font-size:120px;color:var(–glow);
}
#count.on{display:flex;}

.hint{font-size:14px;color:var(–muted);line-height:1.6;}
.dot{width:10px;height:10px;border-radius:50%;background:var(–coral);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

  </main>

  <div id="status"><span id="msg">けんばんに さわると おとが なります</span></div>

  <div id="stage">
    <div id="keyboard"></div>
    <div id="rest">やすみ</div>
    <div id="count">3</div>
  </div>
</div>

<script>
(() => {
/* ============ おと ============ */
let ac = null;
const voices = new Map();
function audio(){
  if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
const freq = m => 440 * Math.pow(2,(m-69)/12);
function noteOn(id, midi){
  if(voices.has(id)) noteOff(id);
  const c = audio(), t = c.currentTime;
  const g = c.createGain();
  const f = c.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(3600,t);
  f.frequency.exponentialRampToValueAtTime(1300,t+0.7);
  const o1 = c.createOscillator(), o2 = c.createOscillator();
  o1.type='triangle'; o2.type='sine';
  o1.frequency.value = freq(midi); o2.frequency.value = freq(midi)*2.003;
  const g2 = c.createGain(); g2.gain.value = .18;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.34,t+0.012);
  g.gain.exponentialRampToValueAtTime(.13,t+0.9);
  o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(c.destination);
  o1.start(t); o2.start(t);
  voices.set(id,{o1,o2,g});
}
function noteOff(id){
  const v = voices.get(id); if(!v) return;
  voices.delete(id);
  const t = audio().currentTime;
  try{
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(Math.max(v.g.gain.value,0.0001),t);
    v.g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    v.o1.stop(t+0.22); v.o2.stop(t+0.22);
  }catch(e){}
}
function allOff(){ [...voices.keys()].forEach(noteOff); }

/* ============ けんばん ============ */
const LOW = 60, HIGH = 84;
const BLACK = m => [1,3,6,8,10].includes(((m%12)+12)%12);
const NAME = {0:'ド',2:'レ',4:'ミ',5:'ファ',7:'ソ',9:'ラ',11:'シ'};
const kb = document.getElementById('keyboard');
const keyEl = new Map();
const whites = [];
for(let m=LOW;m<=HIGH;m++) if(!BLACK(m)) whites.push(m);
const WW = 100/whites.length;

whites.forEach((m,i)=>{
  const d = document.createElement('div');
  d.className = 'key wk' + (m>=72?' oct2':'');
  d.style.left = (i*WW)+'%';
  d.style.width = (WW-0.35)+'%';
  d.textContent = NAME[m%12];
  d.dataset.m = m;
  kb.appendChild(d); keyEl.set(m,d);
});
for(let m=LOW;m<=HIGH;m++){
  if(!BLACK(m)) continue;
  const below = whites.filter(w=>w<m).length;
  const d = document.createElement('div');
  d.className = 'key bk';
  d.style.width = (WW*0.6)+'%';
  d.style.left = (below*WW - WW*0.3)+'%';
  d.dataset.m = m;
  kb.appendChild(d); keyEl.set(m,d);
}

/* タッチ */
const pointers = new Map();
kb.addEventListener('pointerdown', e=>{
  const t = e.target.closest('.key'); if(!t) return;
  e.preventDefault();
  const m = +t.dataset.m;
  pointers.set(e.pointerId, m);
  press(m, 'p'+e.pointerId);
}, {passive:false});
function release(e){
  if(!pointers.has(e.pointerId)) return;
  const m = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  lift(m, 'p'+e.pointerId);
}
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());

function press(m, id){
  noteOn(id, m);
  const el = keyEl.get(m); if(el) el.classList.add('press');
  if(rec.on) recDown(m);
  if(play.on && play.mode==='wait') waitInput(m);
}
function lift(m, id){
  noteOff(id);
  const el = keyEl.get(m); if(el) el.classList.remove('press');
  if(rec.on) recUp(m);
}

function litSet(set){
  keyEl.forEach((el,m)=>{
    if(set.has(m)) el.classList.add('lit'); else el.classList.remove('lit','blink');
  });
}
function clearAll(){
  keyEl.forEach(el=>el.classList.remove('lit','blink','hit','bad'));
  restEl.classList.remove('on');
}

/* ============ ほぞん ============ */
const KEY = 'piano:songs:v1';
let songs = [null,null,null,null,null];
let slotRec = 0, slotPlay = 0;

async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const a = JSON.parse(raw);
      if(Array.isArray(a)) songs = a.slice(0,5);
      while(songs.length<5) songs.push(null);
    }
  }catch(e){ /* まだ ほぞんが ない */ }
  drawSlots();
}
async function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(songs)); }
  catch(e){ msg('ほぞんできませんでした。もういちど ためしてね','alert'); }
}

const slotsRec = document.getElementById('slots-rec');
const slotsPlay = document.getElementById('slots-play');
function drawSlots(){
  [[slotsRec,'rec'],[slotsPlay,'play']].forEach(([box,kind])=>{
    box.innerHTML = '';
    songs.forEach((s,i)=>{
      const b = document.createElement('button');
      const cur = kind==='rec' ? slotRec : slotPlay;
      b.className = 'slot' + (i===cur?' on':'') + (s?'':' empty');
      b.innerHTML = '<b>'+(i+1)+'</b>' + (s ? esc(s.name) : 'あいてます');
      b.onclick = ()=>{
        if(kind==='rec'){ slotRec=i; nameInput.value = s?s.name:''; pending=null; syncRecBtns(); }
        else { stopPlay(); slotPlay=i; }
        drawSlots();
      };
      box.appendChild(b);
    });
  });
  syncRecBtns();
}
const esc = t => String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ============ ろくおん ============ */
const rec = {on:false, t0:0, notes:[], open:new Map()};
let pending = null;
const nameInput = document.getElementById('sname');
const btnRec = document.getElementById('btn-rec');
const btnSave = document.getElementById('btn-save');
const btnListen = document.getElementById('btn-listen');

function recDown(m){
  const t = performance.now() - rec.t0;
  if(rec.open.has(m)){ const n = rec.open.get(m); n.e = t; rec.open.delete(m); }
  const n = {m, s:t, e:null};
  rec.notes.push(n); rec.open.set(m,n);
  msg('おぼえています… '+rec.notes.length+'こ');
}
function recUp(m){
  const n = rec.open.get(m); if(!n) return;
  n.e = performance.now() - rec.t0; rec.open.delete(m);
}
btnRec.onclick = ()=>{
  if(rec.on){ stopRec(); return; }
  audio();
  countdown(()=>{
    rec.on = true; rec.t0 = performance.now(); rec.notes = []; rec.open.clear();
    pending = null;
    btnRec.textContent = 'ろくおんを とめる';
    msg('ひいてね!','alert', true);
    syncRecBtns();
  });
};
function stopRec(){
  if(!rec.on) return;
  rec.on = false;
  const now = performance.now() - rec.t0;
  rec.open.forEach(n=>{ n.e = now; }); rec.open.clear();
  btnRec.textContent = 'ろくおんを はじめる';
  let notes = rec.notes.filter(n=>n.e - n.s > 30);
  if(!notes.length){ msg('おとが はいりませんでした。もういちど ろくおんしてね','alert'); pending=null; syncRecBtns(); return; }
  const off = notes[0].s;
  notes = notes.map(n=>({m:n.m, s:Math.round(n.s-off), e:Math.round(n.e-off)}));
  pending = {name: (nameInput.value.trim() || ('きょく'+(slotRec+1))), notes};
  msg('できました! '+notes.length+'この おとを おぼえました','good');
  syncRecBtns();
}
btnSave.onclick = async ()=>{
  if(!pending) return;
  pending.name = nameInput.value.trim() || pending.name;
  songs[slotRec] = pending;
  await save();
  msg('「'+pending.name+'」を '+(slotRec+1)+'ばんに ほぞんしました','good');
  pending = null; drawSlots();
};
btnListen.onclick = ()=>{
  const s = pending || songs[slotRec];
  if(!s) return;
  startLead(s, 1, 'auto', true);
};
document.getElementById('btn-del').onclick = async ()=>{
  songs[slotRec] = null; pending = null; nameInput.value='';
  await save(); drawSlots();
  msg((slotRec+1)+'ばんを けしました');
};
function syncRecBtns(){
  btnSave.disabled = !pending;
  btnListen.disabled = !(pending || songs[slotRec]);
}

/* ============ カウントダウン ============ */
const countEl = document.getElementById('count');
function countdown(done){
  let n = 3;
  countEl.textContent = n; countEl.classList.add('on');
  const iv = setInterval(()=>{
    n--;
    if(n===0){ countEl.textContent = 'スタート!'; }
    else if(n<0){ clearInterval(iv); countEl.classList.remove('on'); done(); }
    else countEl.textContent = n;
  }, 800);
}

/* ============ れんしゅう ============ */
const restEl = document.getElementById('rest');
const play = {on:false, mode:'wait', speed:.75, song:null, steps:null, idx:0, done:new Set(), raf:0, sounding:new Map(), preview:false};
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');

document.querySelectorAll('#seg-mode button').forEach(b=>{
  b.onclick = ()=>{ stopPlay(); segPick('#seg-mode', b); play.mode = b.dataset.mode; };
});
document.querySelectorAll('#seg-speed button').forEach(b=>{
  b.onclick = ()=>{ segPick('#seg-speed', b); play.speed = +b.dataset.speed; };
});
function segPick(sel, b){ document.querySelectorAll(sel+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }

btnStart.onclick = ()=>{
  const s = songs[slotPlay];
  if(!s){ msg((slotPlay+1)+'ばんは まだ からっぽです。さきに きょくを おぼえさせてね','alert'); return; }
  audio();
  if(play.mode==='auto'){ countdown(()=>startLead(s, play.speed, 'auto', false)); }
  else startWait(s);
};
btnStop.onclick = stopPlay;

/* --- じどう（ながれる）--- */
function mergeSpans(notes){
  const a = notes.map(n=>[n.s,n.e]).sort((x,y)=>x[0]-y[0]);
  const out = [];
  a.forEach(sp=>{
    const last = out[out.length-1];
    if(last && sp[0] <= last[1]+20) last[1] = Math.max(last[1], sp[1]);
    else out.push([sp[0], sp[1]]);
  });
  return out;
}
function startLead(song, speed, mode, preview){
  stopPlay();
  play.on = true; play.mode2 = 'auto'; play.preview = !!preview;
  play.song = song; play.speed = speed;
  play.spans = mergeSpans(song.notes);
  play.end = Math.max(...song.notes.map(n=>n.e)) + 400;
  play.t0 = performance.now();
  play.sounding = new Map();
  btnStop.disabled = false; btnStart.disabled = true;
  msg('みほんが ながれます', '', true);
  loopAuto();
}
function loopAuto(){
  const st = (performance.now() - play.t0) * play.speed;
  const active = new Set();
  play.song.notes.forEach((n,i)=>{
    if(st >= n.s && st < n.e){
      active.add(n.m);
      if(!play.sounding.has(i)){ play.sounding.set(i,1); noteOn('g'+i, n.m); }
    } else if(play.sounding.has(i)){
      play.sounding.delete(i); noteOff('g'+i);
    }
  });
  litSet(active);
  let rest = false;
  if(active.size===0){
    const nxt = play.spans.find(sp=>sp[0] > st);
    const prevEnd = play.spans.filter(sp=>sp[1] <= st).map(sp=>sp[1]).pop() ?? 0;
    if(nxt && (nxt[0] - prevEnd) >= 220) rest = true;
  }
  restEl.classList.toggle('on', rest);
  bar(Math.min(1, st/play.end));
  if(st >= play.end){ finishAuto(); return; }
  play.raf = requestAnimationFrame(loopAuto);
}
function finishAuto(){
  const wasPreview = play.preview;
  stopPlay();
  msg(wasPreview ? 'みほん おわり' : 'さいごまで ながれました!', 'good');
}

/* --- じぶんのペース（まつ）--- */
function buildSteps(notes){
  const a = [...notes].sort((x,y)=>x.s-y.s);
  const steps = [];
  a.forEach(n=>{
    const last = steps[steps.length-1];
    if(last && n.s - last.s < 70){ last.ms.push(n.m); last.len = Math.max(last.len, n.e-n.s); }
    else steps.push({s:n.s, ms:[n.m], len:n.e-n.s, rest:false});
  });
  for(let i=1;i<steps.length;i++){
    const prevEnd = steps[i-1].s + steps[i-1].len;
    steps[i].restBefore = (steps[i].s - prevEnd) >= 350;
  }
  return steps;
}
function startWait(song){
  stopPlay();
  play.on = true; play.mode = 'wait'; play.song = song;
  play.steps = buildSteps(song.notes);
  play.idx = 0; play.done = new Set();
  btnStop.disabled = false; btnStart.disabled = true;
  showStep();
}
function showStep(){
  clearAll();
  const st = play.steps[play.idx];
  if(!st){ return; }
  if(st.restBefore){
    restEl.classList.add('on');
    setTimeout(()=>{ if(play.on) restEl.classList.remove('on'); }, 700);
  }
  st.ms.forEach(m=>{
    const el = keyEl.get(m);
    if(el){ el.classList.add('lit','blink'); }
  });
  const names = st.ms.map(m => NAME[m%12] || (NAME[(m-1)%12]+'の くろいけん')).join(' と ');
  const long = st.len > 700 ? '  ながく のばそう' : '';
  msg('つぎは <b id="target">'+names+'</b>'+long, '', true, play.idx, play.steps.length);
}
function waitInput(m){
  const st = play.steps && play.steps[play.idx];
  if(!st) return;
  if(!st.ms.includes(m)){
    const el = keyEl.get(m);
    if(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),320); }
    return;
  }
  play.done.add(m);
  const el = keyEl.get(m); if(el){ el.classList.remove('blink'); el.classList.add('hit'); }
  if(st.ms.every(x=>play.done.has(x))){
    play.idx++; play.done = new Set();
    bar(play.idx/play.steps.length);
    if(play.idx >= play.steps.length){
      setTimeout(()=>{ if(play.on){ stopPlay(); msg('さいごまで ひけました! すごい!','good'); } }, 350);
      return;
    }
    setTimeout(()=>{ if(play.on) showStep(); }, 260);
  }
}

function stopPlay(){
  if(play.raf) cancelAnimationFrame(play.raf);
  play.raf = 0;
  if(play.on){
    play.on = false;
    [...play.sounding.keys()].forEach(i=>noteOff('g'+i));
    play.sounding = new Map();
  }
  play.steps = null;
  clearAll();
  bar(0);
  btnStop.disabled = true; btnStart.disabled = false;
}

/* ============ ひょうじ ============ */
const statusEl = document.getElementById('status');
function msg(html, kind, withBar, cur, total){
  statusEl.className = kind || '';
  let s = '';
  if(typeof cur === 'number') s += '<span id="bigcount">'+(cur+1)+'/'+total+'</span>';
  s += '<span id="msg">'+html+'</span>';
  if(withBar) s += '<span id="bar"><i style="width:'+(barW*100)+'%"></i></span>';
  statusEl.innerHTML = s;
}
let barW = 0;
function bar(v){
  barW = v;
  const b = document.querySelector('#bar i');
  if(b) b.style.width = (v*100)+'%';
}

/* ============ がめん きりかえ ============ */
const tabs = {rec:document.getElementById('tab-rec'), play:document.getElementById('tab-play')};
function view(v){
  stopRec(); stopPlay(); allOff();
  tabs.rec.classList.toggle('on', v==='rec');
  tabs.play.classList.toggle('on', v==='play');
  document.getElementById('view-rec').classList.toggle('on', v==='rec');
  document.getElementById('view-play').classList.toggle('on', v==='play');
  document.getElementById('mode-name').textContent = v==='rec' ? 'きょくを おぼえる' : 'れんしゅう';
  msg(v==='rec' ? 'けんばんに さわると おとが なります' : 'きょくを えらんで スタート');
}
tabs.rec.onclick = ()=>view('rec');
tabs.play.onclick = ()=>view('play');

load();
})();
